<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>古诗文默写 · 智能学习系统 V2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
    <style>
        /* ===== 主题变量 ===== */
        :root {
            --font-base: 20px;
            --font-small: 17px;
            --font-large: 22px;
            --font-xl: 30px;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --touch-target: 50px;
            --transition: 0.25s ease;
            --bg: #f5f0e8;
            --card: #ffffff;
            --primary: #8b5e3c;
            --primary-light: #a0704a;
            --text: #2c2c2c;
            --text-light: #6b5b4e;
            --border: #d4c8b8;
            --correct: #2e7d32;
            --correct-bg: #e8f5e9;
            --wrong: #c62828;
            --wrong-bg: #ffebee;
            --missing-bg: #e53935;
            --extra-bg: #ffcdd2;
            --modal-overlay: rgba(0,0,0,0.55);
            --input-bg: #fdfcf9;
            --hover-bg: #f5f0ea;
            --shadow-strong: 0 16px 50px rgba(0,0,0,0.25);
            --gold: #f5c842;
            --chart-grid: #d4c8b8;
        }
        [data-theme="dark"] {
            --bg: #1a1816;
            --card: #272420;
            --primary: #d4a373;
            --primary-light: #e0b68a;
            --text: #e8e0d8;
            --text-light: #b0a89a;
            --border: #4a443c;
            --correct: #81c784;
            --correct-bg: #1e3a1f;
            --wrong: #ef9a9a;
            --wrong-bg: #4a1a1a;
            --missing-bg: #c62828;
            --extra-bg: #7a1a1a;
            --modal-overlay: rgba(0,0,0,0.75);
            --input-bg: #2f2b26;
            --hover-bg: #3a352e;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-strong: 0 16px 50px rgba(0,0,0,0.6);
            --chart-grid: #4a443c;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: "Georgia","Noto Serif SC","STSong","SimSun",serif;
            background: var(--bg);
            color: var(--text);
            min-height:100vh;
            padding:20px 28px;
            display:flex;
            justify-content:center;
            align-items:flex-start;
            font-size:var(--font-base);
            transition: background var(--transition), color var(--transition);
            -webkit-tap-highlight-color:transparent;
        }
        .app-container { width:100%; max-width:1440px; display:flex; flex-direction:column; gap:24px; }

        /* ===== 头部 ===== */
        header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:14px;
            padding:14px 0 10px;
            border-bottom:2px solid var(--border);
        }
        header .logo { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        header h1 { font-size:var(--font-xl); color:var(--primary); letter-spacing:2px; font-weight:700; }
        .header-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .btn-icon {
            background:var(--card);
            border:1px solid var(--border);
            border-radius:30px;
            padding:8px 18px;
            font-size:var(--font-small);
            cursor:pointer;
            transition:all var(--transition);
            display:flex;
            align-items:center;
            gap:6px;
            color:var(--text);
            min-height:var(--touch-target);
            font-family:inherit;
            box-shadow:var(--shadow);
        }
        .btn-icon:hover { background:var(--primary); color:#fff; border-color:var(--primary); transform:translateY(-2px); }
        .btn-icon:active { transform:scale(0.96); }
        .btn-manage {
            background:var(--primary);
            color:#fff;
            border:none;
            padding:12px 28px;
            border-radius:30px;
            cursor:pointer;
            font-size:var(--font-small);
            font-family:inherit;
            transition:all var(--transition);
            box-shadow:0 2px 12px rgba(139,94,60,0.35);
            min-height:var(--touch-target);
            display:flex;
            align-items:center;
            gap:8px;
        }
        .btn-manage:hover { background:var(--primary-light); transform:translateY(-2px); }
        .badge-achievement {
            background:var(--gold);
            color:#7a5a2a;
            border-radius:20px;
            padding:4px 16px;
            font-size:0.9rem;
            font-weight:700;
            display:inline-flex;
            align-items:center;
            gap:6px;
            cursor:pointer;
        }
        .streak-badge {
            background:var(--card);
            border:1px solid var(--gold);
            border-radius:20px;
            padding:4px 16px;
            font-size:0.9rem;
            color:var(--text);
        }

        /* ===== 主布局 ===== */
        .main-layout { display:flex; gap:28px; align-items:flex-start; }
        .sidebar {
            flex:0 0 380px;
            background:var(--card);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            border:1px solid var(--border);
            max-height:85vh;
            overflow-y:auto;
            position:sticky;
            top:16px;
            display:flex;
            flex-direction:column;
            transition: background var(--transition), border var(--transition);
        }
        .sidebar-tabs {
            display:flex;
            border-bottom:2px solid var(--border);
            flex-shrink:0;
        }
        .sidebar-tabs button {
            flex:1;
            padding:16px 10px;
            background:transparent;
            border:none;
            font-family:inherit;
            font-size:var(--font-small);
            font-weight:600;
            color:var(--text-light);
            cursor:pointer;
            transition:all var(--transition);
            border-bottom:3px solid transparent;
            min-height:var(--touch-target);
        }
        .sidebar-tabs button.active {
            color:var(--primary);
            border-bottom-color:var(--primary);
        }
        .sidebar-tabs button:hover { background:var(--hover-bg); }
        .sidebar-panel {
            padding:18px 20px;
            overflow-y:auto;
            flex:1;
        }
        .sidebar-panel.hidden { display:none; }

        /* 文库面板 */
        .search-box { position:relative; margin-bottom:14px; }
        .search-box input {
            width:100%;
            padding:14px 48px 14px 20px;
            border:2px solid var(--border);
            border-radius:30px;
            font-size:var(--font-small);
            font-family:inherit;
            background:var(--input-bg);
            color:var(--text);
            transition:all var(--transition);
            outline:none;
            min-height:50px;
        }
        .search-box input:focus { border-color:var(--primary); }
        .search-clear {
            position:absolute; right:12px; top:50%; transform:translateY(-50%);
            background:none; border:none; font-size:2rem; cursor:pointer; color:var(--text-light);
            display:none; padding:6px 12px; border-radius:50%;
        }
        .search-clear.visible { display:block; }
        .search-clear:hover { background:var(--wrong-bg); color:var(--wrong); }
        .search-results { display:none; flex-direction:column; gap:6px; }
        .search-results.visible { display:flex; }
        .search-results .no-result { text-align:center; color:var(--text-light); padding:24px; font-style:italic; }

        .grade-group {
            border:1px solid var(--border);
            border-radius:var(--radius-sm);
            overflow:hidden;
            margin-bottom:10px;
        }
        .grade-group.collapsed > .grade-body { display:none; }
        .grade-header {
            padding:12px 16px;
            cursor:pointer;
            display:flex;
            align-items:center;
            gap:10px;
            background:var(--input-bg);
            border:none;
            width:100%;
            font-family:inherit;
            font-weight:700;
            min-height:var(--touch-target);
            font-size:var(--font-small);
            color:var(--text);
        }
        .grade-header:hover { background:var(--hover-bg); }
        .grade-header .arrow { font-size:0.8rem; transition:transform var(--transition); color:var(--text-light); }
        .grade-header .arrow.expanded { transform:rotate(90deg); }
        .grade-header .group-count {
            font-size:0.8rem;
            color:var(--text-light);
            background:var(--card);
            padding:4px 12px;
            border-radius:12px;
            border:1px solid var(--border);
            margin-left:auto;
        }
        .grade-body { padding:8px; }
        .volume-group {
            border-left:3px solid var(--border);
            margin-left:14px;
            padding-left:10px;
            margin-bottom:6px;
        }
        .volume-group.collapsed > .volume-body { display:none; }
        .volume-header {
            padding:8px 12px;
            cursor:pointer;
            display:flex;
            align-items:center;
            gap:8px;
            background:transparent;
            border:none;
            width:100%;
            font-family:inherit;
            min-height:40px;
            font-size:0.95rem;
            color:var(--text);
        }
        .volume-header:hover { background:var(--hover-bg); border-radius:8px; }
        .volume-header .arrow { font-size:0.7rem; transition:transform var(--transition); color:var(--text-light); }
        .volume-header .arrow.expanded { transform:rotate(90deg); }
        .volume-header .group-count { font-size:0.75rem; color:var(--text-light); background:var(--card); padding:2px 10px; border-radius:10px; border:1px solid var(--border); margin-left:auto; }
        .volume-body { padding:6px 0 6px 10px; }
        .subcategory-title {
            font-size:0.85rem;
            color:var(--text-light);
            padding:8px 8px 4px 14px;
            font-weight:600;
            border-bottom:1px dashed var(--border);
            margin-bottom:4px;
        }
        .poem-list { list-style:none; display:flex; flex-direction:column; gap:3px; }
        .poem-btn {
            width:100%;
            padding:8px 12px 8px 18px;
            border:none;
            background:transparent;
            color:var(--text);
            font-size:0.9rem;
            font-family:inherit;
            cursor:pointer;
            border-radius:8px;
            text-align:left;
            transition:all var(--transition);
            border:1px solid transparent;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            min-height:40px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .poem-btn:hover { background:var(--hover-bg); border-color:var(--border); }
        .poem-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:600; }
        .poem-btn .mastered-star { color:var(--gold); font-size:1.1em; margin-left:auto; }
        .poem-btn .wrong-badge { background:var(--wrong-bg); color:var(--wrong); border-radius:12px; padding:0 10px; font-size:0.75rem; margin-left:auto; }

        /* 仪表盘面板 */
        .stats-grid {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:14px;
            margin-bottom:24px;
        }
        .stat-card {
            background:var(--input-bg);
            border-radius:var(--radius-sm);
            padding:14px;
            text-align:center;
            border:1px solid var(--border);
        }
        .stat-card .number { font-size:2rem; font-weight:700; color:var(--primary); }
        .stat-card .label { font-size:0.85rem; color:var(--text-light); }

        .chart-container {
            background:var(--input-bg);
            border-radius:var(--radius-sm);
            padding:14px;
            border:1px solid var(--border);
            margin-bottom:18px;
        }
        .chart-container canvas { width:100% !important; height:auto !important; max-height:180px; }
        .chart-title { font-size:1rem; font-weight:600; color:var(--text-light); margin-bottom:10px; }

        .mastery-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(80px,1fr));
            gap:8px;
            margin-top:10px;
        }
        .mastery-cell {
            background:var(--input-bg);
            border-radius:8px;
            padding:8px 4px;
            text-align:center;
            font-size:0.8rem;
            border:1px solid var(--border);
            transition:all var(--transition);
        }
        .mastery-cell.mastered { background:var(--correct-bg); border-color:var(--correct); }
        .mastery-cell.partial { background:#fff3cd; border-color:#f5c842; }
        .mastery-cell.poor { background:var(--wrong-bg); border-color:var(--wrong); }

        .review-queue {
            display:flex;
            flex-direction:column;
            gap:10px;
            margin-top:14px;
        }
        .review-item {
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:12px 16px;
            background:var(--input-bg);
            border-radius:var(--radius-sm);
            border-left:4px solid var(--primary);
            cursor:pointer;
            transition:all var(--transition);
        }
        .review-item:hover { background:var(--hover-bg); }
        .review-item .title { font-weight:600; font-size:1rem; }
        .review-item .priority { font-size:0.85rem; color:var(--text-light); }

        /* 内容区 */
        .content-area { flex:1; min-width:0; display:flex; flex-direction:column; gap:24px; }
        .card {
            background:var(--card);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            padding:28px 32px;
            border:1px solid var(--border);
            transition: background var(--transition), border var(--transition);
        }
        .title-bar {
            display:flex;
            align-items:center;
            justify-content:space-between;
            flex-wrap:wrap;
            gap:14px;
            margin-bottom:18px;
            padding-bottom:14px;
            border-bottom:2px solid var(--border);
        }
        .title-bar h2 { font-size:var(--font-large); color:var(--primary); letter-spacing:1px; }
        .title-bar .meta { color:var(--text-light); font-size:var(--font-small); }
        .btn-group { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
        .btn {
            padding:10px 24px;
            border:2px solid var(--primary);
            background:#fff;
            color:var(--primary);
            border-radius:30px;
            cursor:pointer;
            font-size:var(--font-small);
            font-family:inherit;
            transition:all var(--transition);
            font-weight:600;
            min-height:var(--touch-target);
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:6px;
        }
        .btn:hover { background:var(--primary); color:#fff; }
        .btn:active { transform:scale(0.96); }
        .btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
        .btn-primary:hover { background:var(--primary-light); border-color:var(--primary-light); }
        .btn-outline { background:transparent; border-color:var(--border); color:var(--text-light); }
        .btn-outline:hover { border-color:var(--primary); color:var(--primary); background:var(--hover-bg); }
        .btn-sm { padding:8px 18px; font-size:0.9rem; min-height:40px; }
        .btn-mastered { border-color:var(--gold); color:#b8860b; }
        .btn-mastered.active { background:var(--gold); color:#fff; border-color:var(--gold); }
        .btn-focus { background:#2c3e50; color:#fff; border-color:#2c3e50; }
        .btn-focus:hover { background:#1a2632; }

        .input-area textarea {
            width:100%;
            min-height:280px;
            padding:20px 24px;
            border:2px solid var(--border);
            border-radius:var(--radius-sm);
            font-size:var(--font-base);
            font-family:inherit;
            line-height:2.0;
            letter-spacing:1px;
            resize:vertical;
            transition:border-color var(--transition);
            background:var(--input-bg);
            color:var(--text);
        }
        .input-area textarea:focus { outline:none; border-color:var(--primary); }

        .result-area {
            display:none;
            margin-top:18px;
            padding:18px 24px;
            border-radius:var(--radius-sm);
            font-size:var(--font-base);
            line-height:2.2;
            white-space:pre-wrap;
            word-break:break-all;
            max-height:450px;
            overflow-y:auto;
            border:1px solid var(--border);
            background:var(--input-bg);
        }
        .result-area.visible { display:block; }
        .char-correct { color:var(--correct); background:var(--correct-bg); border-radius:4px; padding:1px 3px; }
        .char-wrong { color:var(--wrong); background:var(--wrong-bg); border-radius:4px; padding:1px 3px; font-weight:700; text-decoration:underline wavy var(--wrong); }
        .char-missing { color:#fff; background:var(--missing-bg); border-radius:4px; padding:1px 3px; font-weight:700; }
        .char-extra { color:var(--wrong); background:var(--extra-bg); border-radius:4px; padding:1px 3px; text-decoration:line-through; }

        .score-bar {
            display:none;
            align-items:center;
            gap:18px;
            flex-wrap:wrap;
            padding:14px 20px;
            background:var(--input-bg);
            border-radius:var(--radius-sm);
            margin-top:14px;
            border:1px solid var(--border);
        }
        .score-bar.visible { display:flex; }
        .score-bar .score-text { font-size:var(--font-large); font-weight:700; color:var(--primary); }
        .progress-bar { flex:1; min-width:120px; height:12px; background:var(--border); border-radius:6px; overflow:hidden; }
        .progress-bar .fill { height:100%; background:var(--correct); border-radius:6px; transition:width 0.5s ease; }

        .compare-grid {
            display:none;
            grid-template-columns:1fr 1fr;
            gap:18px;
            margin-top:14px;
            font-size:var(--font-base);
            line-height:2.0;
        }
        .compare-grid.visible { display:grid; }
        .compare-col { padding:14px; border-radius:8px; background:var(--bg); border:1px solid var(--border); overflow-x:auto; }
        .compare-col h4 { color:var(--primary); margin-bottom:8px; font-size:1rem; border-bottom:1px solid var(--border); padding-bottom:6px; }

        .original-text {
            display:none;
            margin-top:14px;
            padding:18px 24px;
            background:var(--input-bg);
            border:1px dashed var(--border);
            border-radius:var(--radius-sm);
            white-space:pre-wrap;
            max-height:450px;
            overflow-y:auto;
        }
        .original-text.visible { display:block; }
        .original-text .label { color:var(--primary); font-weight:700; display:block; margin-bottom:10px; }

        .status-bar {
            display:flex;
            gap:20px;
            flex-wrap:wrap;
            padding:10px 0;
            font-size:0.95rem;
            color:var(--text-light);
            border-bottom:1px solid var(--border);
            margin-bottom:14px;
        }
        .status-bar .item { display:flex; align-items:center; gap:6px; }
        .status-bar .item strong { color:var(--text); }

        /* 专注模式 */
        .focus-mode .sidebar,
        .focus-mode header .header-actions .btn-icon:not(.btn-focus),
        .focus-mode header .btn-manage,
        .focus-mode .card .btn-group .btn:not(.btn-focus),
        .focus-mode .card .title-bar .meta,
        .focus-mode .status-bar,
        .focus-mode .original-text,
        .focus-mode .compare-grid,
        .focus-mode .score-bar .score-detail,
        .focus-mode .btn-group .btn-outline,
        .focus-mode .btn-group .btn-mastered,
        .focus-mode .btn-group .btn-sm:not(.btn-focus) {
            display: none !important;
        }
        .focus-mode .sidebar { display: none !important; }
        .focus-mode .main-layout { justify-content: center; }
        .focus-mode .content-area { max-width: 850px; }
        .focus-mode .input-area textarea { min-height: 450px; }
        .focus-mode .card { box-shadow: none; border-color: transparent; background: transparent; }
        .focus-mode .btn-focus { background: var(--wrong); border-color: var(--wrong); color:#fff; }
        .focus-mode .btn-focus:hover { background: var(--wrong-bg); color:var(--wrong); }

        /* 模态框 */
        .modal-overlay {
            display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            background:var(--modal-overlay);
            z-index:1000;
            justify-content:center;
            align-items:center;
            padding:24px;
            backdrop-filter:blur(4px);
        }
        .modal-overlay.active { display:flex; }
        .modal-content {
            background:var(--card);
            border-radius:var(--radius);
            box-shadow:var(--shadow-strong);
            max-width:1000px;
            width:100%;
            max-height:90vh;
            overflow-y:auto;
            padding:28px 32px;
            border:1px solid var(--border);
        }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:10px; }
        .modal-header h2 { color:var(--primary); font-size:var(--font-xl); }
        .modal-close { background:none; border:none; font-size:2.6rem; cursor:pointer; color:var(--text-light); transition:color var(--transition); line-height:1; min-width:56px; min-height:56px; border-radius:50%; }
        .modal-close:hover { color:var(--wrong); background:var(--wrong-bg); }
        .manage-toolbar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; align-items:center; }
        .poem-edit-item { border:1px solid var(--border); border-radius:var(--radius-sm); padding:20px; background:var(--input-bg); margin-bottom:18px; }
        .poem-edit-item .field-row { display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
        .poem-edit-item .field-row label { font-size:0.9rem; color:var(--text-light); min-width:60px; font-weight:600; }
        .poem-edit-item .field-row input, .poem-edit-item .field-row select, .poem-edit-item .field-row textarea {
            flex:1; padding:10px 14px; border:1.5px solid var(--border); border-radius:8px; font-family:inherit; font-size:var(--font-small); background:var(--card); color:var(--text); min-height:44px;
        }
        .poem-edit-item .field-row textarea { min-height:100px; resize:vertical; }
        .delete-btn { background:var(--wrong-bg); color:var(--wrong); border:1px solid #ffcdd2; border-radius:8px; padding:8px 20px; cursor:pointer; font-size:0.9rem; transition:all var(--transition); font-family:inherit; }
        .delete-btn:hover { background:var(--wrong); color:#fff; }

        .achievement-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
            gap:14px;
            margin:14px 0;
        }
        .achievement-card {
            background:var(--input-bg);
            border-radius:var(--radius-sm);
            padding:14px;
            text-align:center;
            border:1px solid var(--border);
            opacity:0.6;
            transition:all var(--transition);
        }
        .achievement-card.unlocked { opacity:1; border-color:var(--gold); background:var(--correct-bg); }
        .achievement-card .icon { font-size:2.6rem; }
        .achievement-card .name { font-weight:600; font-size:1rem; }
        .achievement-card .desc { font-size:0.8rem; color:var(--text-light); }

        /* 响应式 */
        @media (max-width:1024px) {
            .main-layout { flex-direction:column; }
            .sidebar { flex:none; width:100%; position:static; max-height:400px; }
            .stats-grid { grid-template-columns:1fr 1fr; }
            .compare-grid { grid-template-columns:1fr; }
        }
        @media (max-width:768px) {
            body { padding:12px 16px; font-size:18px; }
            .card { padding:18px; }
            .sidebar { max-height:340px; }
            .stats-grid { grid-template-columns:1fr 1fr; gap:10px; }
            .stat-card .number { font-size:1.6rem; }
            .title-bar h2 { font-size:20px; }
            .btn { padding:8px 16px; font-size:0.9rem; min-height:40px; }
            .input-area textarea { min-height:200px; font-size:18px; }
        }
        .sidebar::-webkit-scrollbar { width:4px; }
        .sidebar::-webkit-scrollbar-track { background:var(--bg); }
        .sidebar::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <header>
        <div class="logo">
            <h1>📜 古诗文默写</h1>
            <span class="badge-achievement" id="achievementBadge">🏅 0</span>

                <div class="search-results" id="searchResults"></div>
                <div id="gradeAccordion"></div>
            </div>
            <!-- 仪表盘面板 -->
            <div class="sidebar-panel hidden" id="panelDashboard">
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card"><div class="number" id="dashTotal">0</div><div class="label">总篇目</div></div>
                    <div class="stat-card"><div class="number" id="dashMastered">0</div><div class="label">已掌握</div></div>
                    <div class="stat-card"><div class="number" id="dashAccuracy">0%</div><div class="label">平均正确率</div></div>
                    <div class="stat-card"><div class="number" id="dashAttempts">0</div><div class="label">练习次数</div></div>

                <div class="chart-container">
                    <div class="chart-title">📊 掌握度矩阵（按年级/类别）</div>

                <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
                    <button class="btn btn-outline btn-sm" id="exportReportBtn" style="flex:1;">📤 导出报告</button>
                    <button class="btn btn-outline btn-sm" id="exportProgressBtn" style="flex:1;" title="包含所有默写原文+当前草稿">📦 导出进度</button>
                    <button class="btn btn-outline btn-sm" id="importProgressBtn" style="flex:1;">📥 导入进度</button>
                    <input type="file" id="importProgressInput" accept=".json" style="display:none;">
                </div>
                <div style="font-size:0.8rem; color:var(--text-light); text-align:center; margin-top:4px;">💡 导出进度包含所有已提交记录 + 当前所有篇目的草稿</div>
            </div>
            <!-- 复习面板 -->
            <div class="sidebar-panel hidden" id="panelReview">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                    <span style="font-weight:600; color:var(--primary); font-size:1.1rem;">📋 今日复习队列</span>
                    <button class="btn btn-sm btn-outline" id="refreshReviewBtn">🔄 刷新</button>
                </div>
                <div id="reviewQueueContainer">
                    <div style="color:var(--text-light); text-align:center; padding:24px;">暂无复习推荐，请先进行默写练习。</div>
                </div>
                <div style="margin-top:18px; border-top:1px solid var(--border); padding-top:14px;">
                    <div style="font-weight:600; color:var(--primary); font-size:1.05rem;">🔁 错题本</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                        <span id="wrongCountDisplay" style="font-size:0.95rem; color:var(--text-light);">共 0 个错字</span>
                        <div style="display:flex; gap:8px;">
                            <button class="btn btn-sm btn-outline" id="reviewWrongBtn">复习错题</button>

        <main class="content-area">

                    <span class="item">📊 上次正确率: <strong id="lastAccuracy">-</strong></span>
                    <span class="item">⏱️ 用时: <strong id="timerDisplay">0s</strong></span>

                <div class="input-area">
                    <textarea id="inputText" placeholder="在此默写全文… (Ctrl+Enter 快速检查)"></textarea>
                </div>
                <div class="btn-group" style="margin-top:14px; gap:10px;">
                    <button class="btn btn-primary" id="checkBtn">✅ 检查默写</button>

                </div>
                <div class="result-area" id="resultArea"></div>
                <div class="compare-grid" id="compareGrid"></div>
            </div>
            <div class="card">
                <div class="original-text" id="originalText">
                    <span class="label">📌 课文原文</span>
                    <span id="originalContent"></span>
                </div>
            </div>
        </main>
    </div>
    <footer style="text-align:center; color:var(--text-light); font-size:0.9rem; padding:14px 0 6px;">
        ⚠️ 一字一标点都不能错 · 数据自动保存 · 智能复习助你掌握
    </footer>
</div>

<!-- 管理模态框 -->

</div>

<script>
    (function() {
        // ================================================================
        // 1. 初始数据
        // ================================================================
        const INITIAL_POEMS = [
            { id:1, title:"观沧海", author:"曹操", grade:"七年级", volume:"上册", subcategory:"课内古诗词", text:"东临碣石，以观沧海。\n水何澹澹，山岛竦峙。\n树木丛生，百草丰茂。\n秋风萧瑟，洪波涌起。\n日月之行，若出其中；\n星汉灿烂，若出其里。\n幸甚至哉，歌以咏志。" },
            { id:2, title:"闻王昌龄左迁龙标遥有此寄", author:"李白", grade:"七年级", volume:"上册", subcategory:"课内古诗词", text:"杨花落尽子规啼，\n闻道龙标过五溪。\n我寄愁心与明月，\n随君直到夜郎西。" },
            { id:3, title:"次北固山下", author:"王湾", grade:"七年级", volume:"上册", subcategory:"课内古诗词", text:"客路青山外，行舟绿水前。\n潮平两岸阔，风正一帆悬。\n海日生残夜，江春入旧年。\n乡书何处达？归雁洛阳边。" },
            { id:4, title:"天净沙·秋思", author:"马致远", grade:"七年级", volume:"上册", subcategory:"课内古诗词", text:"枯藤老树昏鸦，\n小桥流水人家，\n古道西风瘦马。\n夕阳西下，\n断肠人在天涯。" },
            { id:5, title:"咏雪", author:"《世说新语》", grade:"七年级", volume:"上册", subcategory:"课内文言文", text:"谢太傅寒雪日内集，与儿女讲论文义。俄而雪骤，公欣然曰：“白雪纷纷何所似？”兄子胡儿曰：“撒盐空中差可拟。”兄女曰：“未若柳絮因风起。”公大笑乐。即公大兄无奕女，左将军王凝之妻也。" },
            { id:6, title:"陈太丘与友期行", author:"《世说新语》", grade:"七年级", volume:"上册", subcategory:"课内文言文", text:"陈太丘与友期行，期日中。过中不至，太丘舍去，去后乃至。元方时年七岁，门外戏。客问元方：“尊君在不？”答曰：“待君久不至，已去。”友人便怒曰：“非人哉！与人期行，相委而去。”元方曰：“君与家君期日中。日中不至，则是无信；对子骂父，则是无礼。”友人惭，下车引之。元方入门不顾。" },
            { id:7, title:"《论语》十二章", author:"《论语》", grade:"七年级", volume:"上册", subcategory:"课内文言文", text:"子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”\n曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”\n子曰：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”\n子曰：“温故而知新，可以为师矣。”\n子曰：“学而不思则罔，思而不学则殆。”\n子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！”\n子曰：“知之者不如好之者，好之者不如乐之者。”\n子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”\n子曰：“三人行，必有我师焉。择其善者而从之，其不善者而改之。”\n子在川上曰：“逝者如斯夫，不舍昼夜。”\n子曰：“三军可夺帅也，匹夫不可夺志也。”\n子夏曰：“博学而笃志，切问而近思，仁在其中矣。”" },
            { id:8, title:"诫子书", author:"诸葛亮", grade:"七年级", volume:"上册", subcategory:"课内文言文", text:"夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。夫学须静也，才须学也，非学无以广才，非志无以成学。淫慢则不能励精，险躁则不能治性。年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！" },
            { id:9, title:"狼", author:"蒲松龄", grade:"七年级", volume:"上册", subcategory:"课内文言文", text:"一屠晚归，担中肉尽，止有剩骨。途中两狼，缀行甚远。屠惧，投以骨。一狼得骨止，一狼仍从。复投之，后狼止而前狼又至。骨已尽矣，而两狼之并驱如故。屠大窘，恐前后受其敌。顾野有麦场，场主积薪其中，苫蔽成丘。屠乃奔倚其下，弛担持刀。狼不敢前，眈眈相向。少时，一狼径去，其一犬坐于前。久之，目似瞑，意暇甚。屠暴起，以刀劈狼首，又数刀毙之。方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。身已半入，止露尻尾。屠自后断其股，亦毙之。乃悟前狼假寐，盖以诱敌。狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。" },
            { id:10, title:"穿井得一人", author:"《吕氏春秋》", grade:"七年级", volume:"上册", subcategory:"课内文言文", text:"宋之丁氏，家无井而出溉汲，常一人居外。及其家穿井，告人曰：“吾穿井得一人。”有闻而传之者：“丁氏穿井得一人。”国人道之，闻之于宋君。宋君令人问之于丁氏，丁氏对曰：“得一人之使，非得一人于井中也。”求闻之若此，不若无闻也。" },
            { id:11, title:"杞人忧天", author:"《列子》", grade:"七年级", volume:"上册", subcategory:"课内文言文", text:"杞国有人忧天地崩坠，身亡所寄，废寝食者。又有忧彼之所忧者，因往晓之，曰：“天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？”其人曰：“天果积气，日月星宿，不当坠耶？”晓之者曰：“日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。”其人曰：“奈地坏何？”晓之者曰：“地，积块耳，充塞四虚，亡处亡块。若躇步跐蹈，终日在地上行止，奈何忧其坏？”其人舍然大喜，晓之者亦舍然大喜。" },
            { id:12, title:"峨眉山月歌", author:"李白", grade:"七年级", volume:"上册", subcategory:"课外古诗词诵读", text:"峨眉山月半轮秋，\n影入平羌江水流。\n夜发清溪向三峡，\n思君不见下渝州。" },
            { id:13, title:"江南逢李龟年", author:"杜甫", grade:"七年级", volume:"上册", subcategory:"课外古诗词诵读", text:"岐王宅里寻常见，\n崔九堂前几度闻。\n正是江南好风景，\n落花时节又逢君。" },
            { id:14, title:"行军九日思长安故园", author:"岑参", grade:"七年级", volume:"上册", subcategory:"课外古诗词诵读", text:"强欲登高去，\n无人送酒来。\n遥怜故园菊，\n应傍战场开。" },
            { id:15, title:"夜上受降城闻笛", author:"李益", grade:"七年级", volume:"上册", subcategory:"课外古诗词诵读", text:"回乐烽前沙似雪，\n受降城外月如霜。\n不知何处吹芦管，\n一夜征人尽望乡。" },
            { id:16, title:"秋词（其一）", author:"刘禹锡", grade:"七年级", volume:"上册", subcategory:"课外古诗词诵读", text:"自古逢秋悲寂寥，\n我言秋日胜春朝。\n晴空一鹤排云上，\n便引诗情到碧霄。" },
            { id:17, title:"夜雨寄北", author:"李商隐", grade:"七年级", volume:"上册", subcategory:"课外古诗词诵读", text:"君问归期未有期，\n巴山夜雨涨秋池。\n何当共剪西窗烛，\n却话巴山夜雨时。" },
            { id:18, title:"十一月四日风雨大作（其二）", author:"陆游", grade:"七年级", volume:"上册", subcategory:"课外古诗词诵读", text:"僵卧孤村不自哀，\n尚思为国戍轮台。\n夜阑卧听风吹雨，\n铁马冰河入梦来。" },
            { id:19, title:"潼关", author:"谭嗣同", grade:"七年级", volume:"上册", subcategory:"课外古诗词诵读", text:"终古高云簇此城，\n秋风吹散马蹄声。\n河流大野犹嫌束，\n山入潼关不解平。" }
        ];

        // ================================================================
        // 2. 工具 & 存储
        // ================================================================
        function escapeHtml(str) { if (!str) return ''; const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
        function sanitizeHtml(html) { if (window.DOMPurify) return DOMPurify.sanitize(html); return html; }
        function debounce(fn, delay) { let timer; return function(...args){ clearTimeout(timer); timer=setTimeout(()=>fn.apply(this,args), delay); }; }

        const Storage = {
            get(key, def) { try { const v=localStorage.getItem('poemApp_'+key); return v?JSON.parse(v):def; } catch(e){ return def; } },
            set(key, val) { localStorage.setItem('poemApp_'+key, JSON.stringify(val)); }
        };

        // ================================================================
        // 3. 应用状态
        // ================================================================
        let poems = [];
        let nextId = 1;
        let currentId = null;
        let expandedGrades = {};
        let expandedVolumes = {};
        let theme = 'light';
        let history = [];           // 每条记录含 poemId, timestamp, accuracy, userInput
        let wrongChars = {};
        let draft = {};            // 草稿：{ poemId: '用户输入的文本' }
        let mastered = [];
        let examMode = false;
        let examQueue = [];
        let examResults = [];
        let isSpeaking = false;
        let focusMode = false;
        let timerInterval = null;
        let timerSeconds = 0;
        let timerRunning = false;

        const ACHIEVEMENTS = [
            { id:'first_ten', name:'初出茅庐', desc:'完成10次默写', icon:'🌱', check:()=>history.length>=10 },
            { id:'master_ten', name:'十篇精通', desc:'掌握10篇', icon:'📖', check:()=>mastered.length>=10 },
            { id:'perfect_five', name:'百炼成钢', desc:'正确率100%达5次', icon:'💪', check:()=>history.filter(h=>h.accuracy===100).length>=5 },
            { id:'streak_seven', name:'勤学不辍', desc:'连续学习7天', icon:'🔥', check:()=>getConsecutiveDays()>=7 },
            { id:'all_mastered', name:'诗词达人', desc:'掌握全部篇目', icon:'🏅', check:()=>mastered.length===poems.length && poems.length>0 },
            { id:'review_master', name:'温故知新', desc:'完成10次复习推荐', icon:'🔄', check:()=>Storage.get('reviewCompleted',0)>=10 }
        ];
        let unlockedAchievements = Storage.get('achievements', []);

        // ================================================================
        // 4. 核心逻辑
        // ================================================================
        function loadState() {
            poems = Storage.get('poems', JSON.parse(JSON.stringify(INITIAL_POEMS)));

        // ---- diff ----
        function diffChars(origArr, userArr) {
            const m=origArr.length, n=userArr.length;
            const dp=Array.from({length:m+1}, ()=>new Uint16Array(n+1));
            for(let i=0;i<=m;i++) dp[i][0]=i;
            for(let j=0;j<=n;j++) dp[0][j]=j;
            for(let i=1;i<=m;i++) {
                for(let j=1;j<=n;j++) {
                    const cost=origArr[i-1]===userArr[j-1]?0:1;
                    dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
                }
            }
            const ops=[]; let i=m, j=n;
            while(i>0||j>0) {
                if(i>0&&j>0&&origArr[i-1]===userArr[j-1]) { ops.push({type:'equal', char:origArr[i-1]}); i--; j--; }
                else if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+1) { ops.push({type:'replace', origChar:origArr[i-1], userChar:userArr[j-1]}); i--; j--; }
                else if(i>0&&dp[i][j]===dp[i-1][j]+1) { ops.push({type:'delete', char:origArr[i-1]}); i--; }
                else { ops.push({type:'insert', char:userArr[j-1]}); j--; }
            }
            ops.reverse();
            let correct=0, replaces=0, deletes=0, inserts=0;
            const wrongList=[];
            ops.forEach(op=>{
                if(op.type==='equal') correct++;
                else if(op.type==='replace') { replaces++; wrongList.push({wrong:op.userChar, correct:op.origChar}); }
                else if(op.type==='delete') { deletes++; wrongList.push({wrong:'【漏】', correct:op.char}); }
                else if(op.type==='insert') inserts++;
            });
            const total=origArr.length;
            const accuracy=total>0?Math.round((correct/total)*1000)/10:0;
            return { ops, correct, total, accuracy, replaces, deletes, inserts, wrongList };
        }

        // ---- 检查 ----
        function checkDictation() {
            const poem = poems.find(p=>p.id===currentId);
            if (!poem) { alert('请选择一篇诗文'); return; }
            const user = document.getElementById('inputText').value;
            const orig = poem.text;
            if (user.trim().length===0) { alert('请先输入默写内容！'); return; }
            const origArr=Array.from(orig), userArr=Array.from(user);
            const result = diffChars(origArr, userArr);

            // 记录历史，包含用户输入全文
            const record = {
                poemId: poem.id,
                timestamp: Date.now(),
                accuracy: result.accuracy,
                replaces: result.replaces,
                deletes: result.deletes,
                inserts: result.inserts,
                totalChars: result.total,
                wrongDetails: result.wrongList,
                userInput: user,
                poemTitle: poem.title,
                poemAuthor: poem.author
            };
            history.push(record);
            if (history.length>500) history = history.slice(-500);

            result.wrongList.forEach(w=>{
                const key = w.wrong==='【漏】' ? '【漏】'+w.correct : w.wrong;
                if(!wrongChars[key]) wrongChars[key]={count:0, contexts:[]};
                wrongChars[key].count += 1;
                if(wrongChars[key].contexts.length<5) wrongChars[key].contexts.push(w.correct);
            });

            // 检查后不清除草稿，保留用户输入
            saveState();
            displayResult(result);
            updateAllStats();
            updateWrongDisplay();
            updateStatusBar();
            checkAchievements();
            renderReviewQueue();
        }

        function displayResult(result) {
            const { ops, correct, total, accuracy, replaces, deletes, inserts } = result;
            let html='';
            for(const op of ops) {
                if(op.type==='equal') {
                    if(op.char==='\n') html+='<br>';
                    else html+=`<span class="char-correct">${escapeHtml(op.char)}</span>`;
                } else if(op.type==='replace') {
                    if(op.origChar==='\n') html+='<br>';
                    else html+=`<span class="char-wrong" title="原文：${escapeHtml(op.origChar)} → 你写：${escapeHtml(op.userChar)}">${escapeHtml(op.userChar)}</span>`;
                } else if(op.type==='delete') {
                    if(op.char==='\n') html+='<br>';
                    else html+=`<span class="char-missing" title="遗漏：${escapeHtml(op.char)}">${escapeHtml(op.char)}</span>`;
                } else if(op.type==='insert') {
                    if(op.char==='\n') html+='<br>';
                    else html+=`<span class="char-extra" title="多余：${escapeHtml(op.char)}">${escapeHtml(op.char)}</span>`;
                }
            }
            const area = document.getElementById('resultArea');
            area.innerHTML = sanitizeHtml(html);
            area.classList.add('visible');
            area.scrollTop=0;
            const bar = document.getElementById('scoreBar');
            bar.classList.add('visible');
            document.getElementById('scoreText').textContent = `正确率：${accuracy}%`;
            document.getElementById('scoreDetail').textContent = `正确 ${correct} / 共 ${total} 字；替换 ${replaces}，缺失 ${deletes}，多余 ${inserts}`;
            document.getElementById('progressFill').style.width = `${accuracy}%`;

            if (document.getElementById('toggleViewBtn').textContent.includes('并排')) {
                renderCompare(result);
            } else {
                document.getElementById('compareGrid').classList.remove('visible');
            }
            area.scrollIntoView({ behavior:'smooth', block:'nearest' });
            if (accuracy===100) {
                const emojis = ['🎉', '✨', '🌟', '👏'];
                const e = emojis[Math.floor(Math.random()*emojis.length)];
                setTimeout(()=>{ 
                    const badge = document.getElementById('achievementBadge');
                    badge.textContent = e + ' 完美!';
                    setTimeout(()=>{ badge.textContent = '🏅 ' + unlockedAchievements.length; }, 2000);
                }, 300);
            }
        }

        function renderCompare(result) {
            const poem = poems.find(p=>p.id===currentId);
            if (!poem) return;
            const origLines = poem.text.split('\n');
            const userLines = document.getElementById('inputText').value.split('\n');
            const maxLines = Math.max(origLines.length, userLines.length);
            let origHtml='', userHtml='';
            for(let i=0;i<maxLines;i++){
                const o=origLines[i]||'', u=userLines[i]||'';
                const oArr=Array.from(o), uArr=Array.from(u);
                const localResult=diffChars(oArr,uArr);
                let oLine='', uLine='';
                for(const op of localResult.ops){
                    if(op.type==='equal'){ oLine+=escapeHtml(op.char); uLine+=escapeHtml(op.char); }
                    else if(op.type==='replace'){ oLine+=`<span class="char-correct">${escapeHtml(op.origChar)}</span>`; uLine+=`<span class="char-wrong">${escapeHtml(op.userChar)}</span>`; }
                    else if(op.type==='delete'){ oLine+=`<span class="char-missing">${escapeHtml(op.char)}</span>`; uLine+=`<span style="opacity:0.3;">_</span>`; }
                    else if(op.type==='insert'){ oLine+=`<span style="opacity:0.3;">_</span>`; uLine+=`<span class="char-extra">${escapeHtml(op.char)}</span>`; }
                }
                origHtml+=`<div class="line">${oLine||'&nbsp;'}</div>`;
                userHtml+=`<div class="line">${uLine||'&nbsp;'}</div>`;
            }
            const grid=document.getElementById('compareGrid');
            grid.innerHTML=`<div class="compare-col"><h4>📖 原文</h4>${origHtml}</div><div class="compare-col"><h4>✍️ 你的默写</h4>${userHtml}</div>`;
            grid.classList.add('visible');
        }

        function giveHint() {
            const poem=poems.find(p=>p.id===currentId);
            if(!poem) return;
            const text = poem.text;
            const user = document.getElementById('inputText').value;
            const hintChars = Array.from(text);
            const userChars = Array.from(user);
            let pos = 0;
            while (pos < hintChars.length && pos < userChars.length && hintChars[pos]===userChars[pos]) pos++;
            if (pos >= hintChars.length) { alert('你已经写完整了！继续加油！'); return; }
            const hintChar = hintChars[pos];
            if (hintChar === '\n') {
                let nextLine = '';
                let idx = pos+1;
                while (idx < hintChars.length && hintChars[idx] !== '\n') { nextLine += hintChars[idx]; idx++; }
                alert(`💡 提示：下一句开头是 “${nextLine.slice(0, 10)}...”`);
            } else {
                alert(`💡 提示：当前位置（第${pos+1}字）应为 “${hintChar}”`);
            }
        }

        function startExam() {
            if (poems.length < 5) { alert('题库少于5篇，无法考试'); return; }
            const shuffled = [...poems].sort(()=>Math.random()-0.5);
            examQueue = shuffled.slice(0,5);
            examResults = [];
            examMode = true;
            alert(`📝 考试模式：共 ${examQueue.length} 篇，请依次默写！`);
            selectPoem(examQueue[0].id);
            document.getElementById('examModeBtn').textContent = `📝 考试中 (1/${examQueue.length})`;
        }

        function handleExamCheck() {
            if (!examMode || !examQueue.length) return;
            const poem=poems.find(p=>p.id===currentId);
            if(!poem) return;
            const user=document.getElementById('inputText').value;
            if(user.trim().length===0){ alert('请先输入默写内容！'); return; }
            const result=diffChars(Array.from(poem.text), Array.from(user));
            examResults.push({ title: poem.title, accuracy: result.accuracy });
            displayResult(result);
            const record = {
                poemId: poem.id, timestamp: Date.now(), accuracy: result.accuracy,
                replaces: result.replaces, deletes: result.deletes, inserts: result.inserts,
                totalChars: result.total, wrongDetails: result.wrongList,
                userInput: user, poemTitle: poem.title, poemAuthor: poem.author
            };
            history.push(record);
            if (history.length>500) history = history.slice(-500);
            saveState();
            updateAllStats();
            const idx = examResults.length;
            if (idx < examQueue.length) {
                alert(`✅ 第 ${idx} 篇完成！正确率 ${result.accuracy}%。点击确定继续下一篇。`);
                selectPoem(examQueue[idx].id);
                document.getElementById('examModeBtn').textContent = `📝 考试中 (${idx+1}/${examQueue.length})`;
            } else {
                examMode = false;
                const avg = examResults.reduce((s,r)=>s+r.accuracy,0)/examResults.length;
                let summary = `📊 考试结束！\n平均正确率：${avg.toFixed(1)}%\n\n`;
                examResults.forEach((r,i)=>{ summary+=`${i+1}. ${r.title} : ${r.accuracy}%\n`; });
                alert(summary);
                document.getElementById('examModeBtn').textContent = '📝 考试(5篇)';
                examQueue=[]; examResults=[];
                if(poems.length) selectPoem(poems[0].id);
            }
        }

        function speakPoem() {
            const poem=poems.find(p=>p.id===currentId);
            if(!poem) return;
            if(isSpeaking){ window.speechSynthesis?.cancel(); isSpeaking=false; document.getElementById('speakBtn').textContent='🔊 朗读'; return; }
            if(!window.speechSynthesis){ alert('浏览器不支持语音'); return; }
            const utter=new SpeechSynthesisUtterance(poem.text);
            utter.lang='zh-CN'; utter.rate=0.9; utter.pitch=1;
            isSpeaking=true; document.getElementById('speakBtn').textContent='🔊 停止';
            utter.onend=()=>{ isSpeaking=false; document.getElementById('speakBtn').textContent='🔊 朗读'; };
            utter.onerror=()=>{ isSpeaking=false; document.getElementById('speakBtn').textContent='🔊 朗读'; };
            window.speechSynthesis.speak(utter);
        }

        // ================================================================
        // 5. 侧边栏渲染
        // ================================================================
        function renderSidebar() {
            const validGrades = new Set(poems.map(p=>p.grade));
            Object.keys(expandedGrades).forEach(g=>{ if(!validGrades.has(g)) delete expandedGrades[g]; });
            const gradeGroups={};
            poems.forEach(p=>{ if(!gradeGroups[p.grade]) gradeGroups[p.grade]=[]; gradeGroups[p.grade].push(p); });
            let html='';
            for(const [gradeName, gradePoems] of Object.entries(gradeGroups)){
                const hasCurrent=gradePoems.some(p=>p.id===currentId);
                const isExpanded=expandedGrades[gradeName]!==undefined?expandedGrades[gradeName]:hasCurrent;
                expandedGrades[gradeName]=isExpanded;
                const volumeGroups={};
                gradePoems.forEach(p=>{ if(!volumeGroups[p.volume]) volumeGroups[p.volume]=[]; volumeGroups[p.volume].push(p); });
                let volumesHtml='';
                for(const [volName, volPoems] of Object.entries(volumeGroups)){
                    const volKey=gradeName+'/'+volName;
                    const volHasCurrent=volPoems.some(p=>p.id===currentId);
                    const volExpanded=expandedVolumes[volKey]!==undefined?expandedVolumes[volKey]:(isExpanded&&volHasCurrent);
                    expandedVolumes[volKey]=volExpanded;
                    const subcatGroups={};
                    volPoems.forEach(p=>{ if(!subcatGroups[p.subcategory]) subcatGroups[p.subcategory]=[]; subcatGroups[p.subcategory].push(p); });
                    let subcatHtml='';
                    for(const [subName, subPoems] of Object.entries(subcatGroups)){
                        subcatHtml+=`<div class="subcategory-title">${escapeHtml(subName)}</div><ul class="poem-list">`;
                        subPoems.forEach(p=>{
                            const isMastered=mastered.includes(p.id);
                            const wrongCount = history.filter(h=>h.poemId===p.id && h.accuracy<100).length;
                            subcatHtml+=`<li><button class="poem-btn ${p.id===currentId?'active':''}" data-id="${p.id}">
                                <span>${escapeHtml(p.title)}</span>
                                ${isMastered?'<span class="mastered-star">⭐</span>':''}
                                ${wrongCount>0?`<span class="wrong-badge">${wrongCount}</span>`:''}
                            </button></li>`;
                        });
                        subcatHtml+='</ul>';
                    }
                    volumesHtml+=`
                        <div class="volume-group ${volExpanded?'expanded':'collapsed'}">
                            <button class="volume-header" data-volume="${escapeHtml(volName)}" data-grade="${escapeHtml(gradeName)}">
                                <span class="arrow ${volExpanded?'expanded':''}">▶</span>
                                <span class="group-name">${escapeHtml(volName)}</span>
                                <span class="group-count">${volPoems.length}</span>
                            </button>
                            <div class="volume-body">${subcatHtml}</div>
                        </div>`;
                }
                html+=`
                    <div class="grade-group ${isExpanded?'expanded':'collapsed'}" data-grade="${escapeHtml(gradeName)}">
                        <button class="grade-header" data-grade="${escapeHtml(gradeName)}">
                            <span class="arrow ${isExpanded?'expanded':''}">▶</span>
                            <span class="group-name">${escapeHtml(gradeName)}</span>
                            <span class="group-count">${gradePoems.length}</span>
                        </button>
                        <div class="grade-body">${volumesHtml}</div>
                    </div>`;
            }
            document.getElementById('gradeAccordion').innerHTML=html;
            document.querySelectorAll('.grade-header').forEach(btn=>{
                btn.addEventListener('click', function(){
                    const g=this.dataset.grade;
                    expandedGrades[g]=!expandedGrades[g];
                    renderSidebar(); saveState();
                });
            });
            document.querySelectorAll('.volume-header').forEach(btn=>{
                btn.addEventListener('click', function(e){
                    e.stopPropagation();
                    const g=this.dataset.grade, v=this.dataset.volume;
                    const key=g+'/'+v;
                    expandedVolumes[key]=!expandedVolumes[key];
                    renderSidebar(); saveState();
                });
            });
            document.querySelectorAll('.poem-btn').forEach(btn=>{
                btn.addEventListener('click', function(){
                    const id=parseInt(this.dataset.id);
                    selectPoem(id);
                });
            });
        }

        // ================================================================
        // 6. 搜索
        // ================================================================
        function handleSearch(keyword) {
            const kw=keyword.trim().toLowerCase();
            const results=document.getElementById('searchResults');
            const clear=document.getElementById('searchClearBtn');
            const accordion=document.getElementById('gradeAccordion');
            if(!kw){
                results.classList.remove('visible');
                clear.classList.remove('visible');
                accordion.style.display='block';
                renderSidebar();
                return;
            }
            clear.classList.add('visible');
            accordion.style.display='none';
            const matches=poems.filter(p=>p.title.toLowerCase().includes(kw)||p.author.toLowerCase().includes(kw)||p.grade.toLowerCase().includes(kw)||p.volume.toLowerCase().includes(kw)||p.subcategory.toLowerCase().includes(kw));
            if(!matches.length){
                results.innerHTML='<div class="no-result">未找到匹配篇目</div>';
            } else {
                let html='';
                matches.forEach(p=>{
                    const isMastered=mastered.includes(p.id);
                    html+=`<button class="poem-btn ${p.id===currentId?'active':''}" data-id="${p.id}">
                        <span class="result-title">${highlightText(p.title, kw)} ${isMastered?'⭐':''}</span>
                        <span class="result-meta">${highlightText(p.author, kw)} · ${escapeHtml(p.grade+p.volume+' '+p.subcategory)}</span>
                    </button>`;

        function highlightText(text, keyword) {
            if(!text||!keyword) return escapeHtml(text);
            const lower=text.toLowerCase(), kw=keyword.toLowerCase();
            let result='', last=0, idx=lower.indexOf(kw);
            while(idx!==-1){
                result+=escapeHtml(text.substring(last,idx));
                result+='<mark>'+escapeHtml(text.substring(idx,idx+kw.length))+'</mark>';
                last=idx+kw.length;
                idx=lower.indexOf(kw,last);
            }
            result+=escapeHtml(text.substring(last));
            return result;
        }

        function getConsecutiveDays() {
            if (!history.length) return 0;
            const dates = history.map(h=>new Date(h.timestamp).toDateString());
            const unique = [...new Set(dates)].sort();
            if (!unique.length) return 0;
            let count = 0;
            let check = new Date();
            while (unique.includes(check.toDateString())) {
                count++;
                check.setDate(check.getDate()-1);
            }
            return count;
        }

        function drawTrendChart() {
            const canvas = document.getElementById('trendChart');
            const ctx = canvas.getContext('2d');
            const W = canvas.parentElement.clientWidth - 24;
            const H = 130;
            canvas.width = W * (window.devicePixelRatio||1);
            canvas.height = H * (window.devicePixelRatio||1);
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
            ctx.clearRect(0,0,W,H);

            const days = 7;
            const now = Date.now();
            const dayMs = 86400000;
            const data = [];
            for (let i=days-1; i>=0; i--) {
                const start = now - i*dayMs;
                const end = start + dayMs;
                const dayHist = history.filter(h => h.timestamp >= start && h.timestamp < end);
                const avg = dayHist.length ? Math.round(dayHist.reduce((s,h)=>s+h.accuracy,0)/dayHist.length*10)/10 : null;
                data.push(avg);
            }

            const padding = { top:10, bottom:22, left:10, right:10 };
            const chartW = W - padding.left - padding.right;
            const chartH = H - padding.top - padding.bottom;
            const maxVal = 100, minVal = 0;

            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--chart-grid').trim() || '#d4c8b8';
            ctx.lineWidth = 0.5;
            for (let i=0; i<=4; i++) {
                const y = padding.top + chartH - (i/4)*chartH;
                ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(W-padding.right, y); ctx.stroke();
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-light').trim() || '#6b5b4e';
                ctx.font = '10px sans-serif';
                ctx.fillText((i*25)+'%', 2, y-2);
            }

            const validData = data.map(d=>d!==null?d:0);
            const points = validData.map((val, i) => {
                const x = padding.left + (i/(days-1))*chartW;
                const y = padding.top + chartH - ((val-minVal)/(maxVal-minVal))*chartH;
                return {x, y, val};
            });

            ctx.beginPath();
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#8b5e3c';
            ctx.lineWidth = 2.5;
            points.forEach((p, i) => {
                if (i===0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();

            points.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, 2*Math.PI);
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#8b5e3c';
                ctx.fill();
                if (p.val !== null && p.val > 0) {
                    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-light').trim() || '#6b5b4e';
                    ctx.font = '9px sans-serif';
                    ctx.fillText(p.val+'%', p.x-10, p.y-8);
                }
            });

            const dateLabels = [];
            for (let i=days-1; i>=0; i--) {
                const d = new Date(now - i*dayMs);
                dateLabels.push((d.getMonth()+1)+'/'+d.getDate());
            }
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-light').trim() || '#6b5b4e';
            ctx.font = '9px sans-serif';
            ctx.textAlign = 'center';
            points.forEach((p, i) => {
                ctx.fillText(dateLabels[i], p.x, H-3);
            });
        }

        function renderMasteryGrid() {
            const grid = document.getElementById('masteryGrid');
            const groups = {};
            poems.forEach(p=>{

                groups[key].poems.push(p);

                html+=`<div class="mastery-cell ${cls}" title="${key}: ${val.mastered}/${val.poems.length}">${key.split('-')[0]}<br>${Math.round(ratio*100)}%</div>`;

        function renderReviewQueue() {
            const container = document.getElementById('reviewQueueContainer');

            if (!queue.length) {

                return;
            }
            let html = '<div class="review-queue">';
            queue.forEach((item) => {
                const poem = poems.find(p=>p.id===item.id);
                if (!poem) return;
                const priority = item.priority > 80 ? '🔴 紧急' : item.priority > 50 ? '🟡 建议' : '🟢 巩固';
                html += `
                    <div class="review-item" data-id="${item.id}">
                        <span class="title">${escapeHtml(poem.title)}</span>
                        <span class="priority">${priority}</span>
                    </div>`;
            });
            html += '</div>';

            container.querySelectorAll('.review-item').forEach(el=>{
                el.addEventListener('click', function(){

        function generateReviewQueue() {
            const scores = poems.map(p => {
                const pHist = history.filter(h=>h.poemId===p.id);
                if (!pHist.length) return { id: p.id, priority: 40 };
                const last = pHist[pHist.length-1];
                const daysSince = (Date.now() - last.timestamp) / 86400000;
                const wrongCount = pHist.filter(h=>h.accuracy<100).length;
                const totalCount = pHist.length;
                const errorRate = totalCount ? wrongCount / totalCount : 0;
                const masteredFlag = mastered.includes(p.id) ? 0 : 20;
                let priority = 20 + Math.min(daysSince * 8, 40) + errorRate * 30 + masteredFlag;
                priority = Math.min(Math.round(priority), 100);
                return { id: p.id, priority };
            });
            scores.sort((a,b)=>b.priority-a.priority);
            return scores.slice(0,5);
        }

        // ================================================================

        // ================================================================
        function importProgressData(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.history || !Array.isArray(data.history)) throw new Error('缺少历史记录数据');
                    if (!data.wrongChars || typeof data.wrongChars !== 'object') throw new Error('缺少错题数据');
                    if (!data.mastered || !Array.isArray(data.mastered)) throw new Error('缺少掌握数据');
                    // draft 可选
                    if (!confirm(`即将导入以下数据：\n- 历史记录 ${data.history.length} 条\n- 错字数 ${Object.keys(data.wrongChars).length}\n- 已掌握 ${data.mastered.length} 篇\n- 草稿 ${data.draft ? Object.keys(data.draft).length : 0} 篇\n\n确定要覆盖当前进度吗？`)) return;
                    history = data.history;
                    wrongChars = data.wrongChars;
                    mastered = data.mastered;
                    mastered = mastered.filter(id => poems.some(p=>p.id===id));
                    // 恢复草稿
                    if (data.draft && typeof data.draft === 'object') {
                        draft = data.draft;
                        // 只保留当前题库中存在的篇目草稿
                        const validIds = new Set(poems.map(p=>p.id));
                        Object.keys(draft).forEach(key => {
                            if (!validIds.has(parseInt(key))) delete draft[key];
                        });
                    } else {
                        draft = {};
                    }
                    // 如果当前篇目有草稿，刷新输入框
                    if (currentId && draft[currentId]) {
                        document.getElementById('inputText').value = draft[currentId];
                    }
                    saveState();
                    updateAllStats();
                    updateWrongDisplay();
                    renderSidebar();
                    renderReviewQueue();
                    alert('✅ 进度数据导入成功！草稿已恢复。');
                } catch (err) {
                    alert('❌ 导入失败：' + err.message);
                }
            };
            reader.readAsText(file);
        }

            const blob=new Blob([JSON.stringify(poems,null,2)], {type:'application/json'});
            const a=document.createElement('a');
            a.href=URL.createObjectURL(blob);
            a.download=`古诗文题库_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            alert('导出成功！');
        }

        function importData(file) {
            const reader=new FileReader();
            reader.onload=function(e){
                try{
                    const data=JSON.parse(e.target.result);
                    if(!Array.isArray(data)) throw new Error('格式错误');
                    poems=data.map((p,idx)=>({...p,id:idx+1}));
                    nextId=poems.length+1;
                    currentId=poems.length?poems[0].id:null;
                    renderManageList(); renderSidebar(); saveState();
                    alert('导入成功！');
                } catch(err){ alert('导入失败: '+err.message); }
            };
            reader.readAsText(file);
        }

        function restoreDefault() {
            if(!confirm('恢复默认将丢失所有自定义修改！')) return;
            poems=JSON.parse(JSON.stringify(INITIAL_POEMS));
            nextId=poems.length+1;
            currentId=poems.length?poems[0].id:null;
            expandedGrades={}; expandedVolumes={};
            renderManageList(); renderSidebar(); saveState();
            alert('已恢复默认题库。');
        }

        // ================================================================
        // 16. 初始化
        // ================================================================
        function init() {
            loadState();

            document.querySelectorAll('.sidebar-tabs button').forEach(btn=>{
                btn.addEventListener('click', function(){ switchTab(this.dataset.tab); });
            });

            document.getElementById('searchInput').addEventListener('input', function(e){ debouncedSearch(e.target.value); });
            document.getElementById('searchClearBtn').addEventListener('click', function(){
                document.getElementById('searchInput').value='';
                this.classList.remove('visible');
                document.getElementById('searchResults').classList.remove('visible');
                document.getElementById('gradeAccordion').style.display='block';
                renderSidebar();
            });

            document.getElementById('checkBtn').addEventListener('click', function(){
                if(examMode) handleExamCheck();
                else checkDictation();
            });
            document.getElementById('resetBtn').addEventListener('click', resetPoem);
            document.getElementById('clearBtn').addEventListener('click', clearAll);
            document.getElementById('toggleOriginalBtn').addEventListener('click', toggleOriginal);
            document.getElementById('toggleViewBtn').addEventListener('click', toggleCompare);
            document.getElementById('masteredBtn').addEventListener('click', toggleMastered);
            document.getElementById('randomBtn').addEventListener('click', randomPoem);
            document.getElementById('speakBtn').addEventListener('click', speakPoem);
            document.getElementById('examModeBtn').addEventListener('click', function(){
                if(examMode){
                    if(!confirm('退出当前考试？')) return;
                    examMode=false; examQueue=[]; examResults=[];
                    this.textContent='📝 考试(5篇)';
                    if(poems.length) selectPoem(poems[0].id);
                } else {
                    startExam();
                }
            });
            document.getElementById('focusToggleBtn').addEventListener('click', toggleFocus);
            document.getElementById('hintBtn').addEventListener('click', giveHint);
            document.getElementById('reviewWrongBtn').addEventListener('click', reviewWrong);
            document.getElementById('clearWrongBtn').addEventListener('click', clearWrong);
            document.getElementById('refreshReviewBtn').addEventListener('click', renderReviewQueue);

            // 导出/导入进度
            document.getElementById('exportProgressBtn').addEventListener('click', exportProgressData);
            document.getElementById('importProgressBtn').addEventListener('click', function(){
                document.getElementById('importProgressInput').click();
            });
            document.getElementById('importProgressInput').addEventListener('change', function(e){
                if(e.target.files.length){
                    importProgressData(e.target.files[0]);
                    e.target.value='';
                }
            });

            document.getElementById('openManageBtn').addEventListener('click', openManage);
            document.getElementById('closeManageBtn').addEventListener('click', closeManage);
            document.getElementById('saveManageBtn').addEventListener('click', function(){
                collectManageData(); renderSidebar(); updateAllStats(); saveState(); alert('保存成功！');
            });
            document.getElementById('addPoemBtn').addEventListener('click', addPoem);
            document.getElementById('exportBtn').addEventListener('click', exportData);
            document.getElementById('importBtn').addEventListener('click', function(){ document.getElementById('importFileInput').click(); });
            document.getElementById('importFileInput').addEventListener('change', function(e){
                if(e.target.files.length){ importData(e.target.files[0]); e.target.value=''; }
            });
            document.getElementById('restoreDefaultBtn').addEventListener('click', restoreDefault);
            document.getElementById('manageModal').addEventListener('click', function(e){ if(e.target===this) closeManage(); });

            document.getElementById('achievementBadge').addEventListener('click', function(){
                document.getElementById('achievementModal').classList.add('active');
                renderAchievements();
            });
            document.getElementById('closeAchievementModal').addEventListener('click', function(){
                document.getElementById('achievementModal').classList.remove('active');
            });
            document.getElementById('achievementModal').addEventListener('click', function(e){
                if(e.target===this) this.classList.remove('active');
            });

            document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);

            document.getElementById('inputText').addEventListener('keydown', function(e){
                if((e.ctrlKey||e.metaKey) && e.key==='Enter'){
                    e.preventDefault();
                    document.getElementById('checkBtn').click();
                }
            });
            document.getElementById('inputText').addEventListener('input', debouncedDraft);

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
                if(theme==='system') applyTheme('system');
            });

            document.getElementById('exportReportBtn').addEventListener('click', exportReport);

            window.addEventListener('beforeunload', function(){ saveDraft(); saveState(); });

            let resizeTimer;
            window.addEventListener('resize', function(){
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(()=>{ drawTrendChart(); }, 300);
            });
        }

        if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    })();
</script>
</body>
</html>
